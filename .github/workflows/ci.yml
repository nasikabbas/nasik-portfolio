name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # check runs the provenance gate first: an unverified figure, or a caveated one
      # rendered without its caveat, fails here rather than reaching a reader.
      - run: npm run check
      - run: npm run build
