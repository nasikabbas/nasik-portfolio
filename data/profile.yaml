roles:
  - id: padelos
    org: PadelOS
    about: Software that padel clubs use to run bookings, payments and their player app. Based in Amsterdam.
    period: Jan 2024 – present
    basis: >-
      His own account; the public PadelGPT report; the PadelGPT repository's agent, tool-server,
      retrieval and release documentation; the production usage exports; the Pollen
      architecture deck and device-configuration files.
    positions:
      - title: Applied AI Lead, PadelGPT
        period: Jan 2025 – present
        about: >-
          PadelGPT is the AI assistant inside PadelOS. It answers players in their own language,
          at any hour, from each club's live bookings, prices and rules.
        plain:
          - >-
            Answers in {pg_languages}. {pg_answered} of conversations were answered outright, and
            where players could choose, {pg_share} already came to PadelGPT rather than club staff.
          - >-
            Led the study that compared PadelGPT with club support staff across all {pg_requests}
            messages players sent over a summer. PadelOS published it.
          - >-
            A segmentation tool turns a club manager's request, written in plain words, into the
            right customer list for a campaign. Its use grew {seg_growth} in three months.
          - >-
            {pg_releases} releases to production in {pg_release_span}, each tested in stages
            before it reached clubs.
        technical:
          - >-
            {pg_agents} LangGraph agents — {pg_agent_split} — behind a player surface and an
            admin surface, calling {pg_tools} tools ({pg_tools_split}) on two FastMCP servers,
            reached in-process and over HTTP for white-label consumers.
          - >-
            Tenancy enforced server-side: identity parameters are stripped from every tool schema
            the model sees and injected at call time from server-set configuration, so a prompt
            cannot widen its own scope.
          - >-
            Text-to-SQL as a bounded, deterministic LangGraph StateGraph — validate, select
            tables, select columns, write, execute, review, at most three loops — on o3 and
            o4-mini against a read-only replica. It powers audience segmentation, with a
            controlled-vocabulary ontology and a classifier that refuses discriminatory targeting.
          - >-
            Retrieval over the club knowledge base on a FAISS inner-product index of normalised
            embeddings, rebuilt by temp-file-then-rename so a live server never reads a
            half-written index.
          - >-
            Measured the two admin surfaces against each other over a quarter: segment use grew
            {seg_growth} to {seg_share_msgs} of admin messages at {seg_cost_share} of admin model
            spend. The efficient surface was the one clubs adopted, so the roadmap moved onto it.
          - >-
            {pg_releases} versioned releases in {pg_release_span}, promoted main → staging →
            release → prod. Authored {pg_commits} commits in the repository.
      - title: Product Manager, Pollen
        period: Jan 2024 – Jan 2025
        about: >-
          Pollen tracked food from farm to shop in Saudi Arabia, so supply problems and spoilage
          could be caught early. It was built at Moonlabor, the company PadelOS was later spun
          out of.
        plain:
          - >-
            Rolled it out on the ground across Riyadh, Jeddah and Dammam–Khobar. Chose where
            trackers went, fitted them to the refrigerated vehicles and warehouses of food
            distributors and a supermarket chain, and trained clients and drivers.
          - >-
            Built a fleet simulator from routes and delivery patterns in real logistics data, so
            the team could test the system day and night without hardware.
          - >-
            Designed the alerting: unusual events are flagged, ranked and paired with a
            recommended action, and a person makes the final call.
        technical:
          - >-
            Device-agnostic IoT ingest: Teltonika, BiTrek and Digital Matter trackers on roaming
            IoT SIMs, with data arriving over MQTT through a webhook or by polling, queued, and
            consumed in chunks.
          - >-
            Simulacrum, an IoT fleet simulator: continuous-monitoring and inter- and intra-city
            travel modes, a configurable fleet and routes, and route choice mined from real
            logistics data, so models could be tested against realistic streams around the clock.
          - >-
            Anomaly triage with a human in the loop: the system flags and ranks supply-chain
            anomalies and recommends an action; the decision stays with a person.
          - >-
            Platform: NestJS microservices on AWS EKS, React, PostgreSQL, Redis, RabbitMQ, the
            ELK stack and CloudWatch.

  - id: founder
    org: Founder
    about: Three companies in three years, in property investing, education and medical technology.
    period: Apr 2021 – Dec 2023
    basis: >-
      The Spectre Bionics investor deck (May 2023); his own account of each venture; the InGrain decks
      (Oct–Nov 2021); his answers of 2026-09-19 and 2026-09-27.
    positions:
      - title: Founder and CEO
        org: Spectre Bionics
        period: Jan – Dec 2023
        about: A medical-technology startup working to restore sight through a brain‑computer interface.
        plain:
          - Its first product let people with paralysis control a computer with their eyes.
          - Built the research team, starting with a prospective co‑founder from MIT.
        technical:
          - >-
            Isaac-1, an MVP that lets quadriplegic users control digital devices with eye
            movement — the first step toward the visor the full system needs.
          - >-
            Built the research team around a prospective co‑founder, a postdoctoral researcher at
            MIT, and grew it from there. The concept: a wearable visor and camera, a high-bandwidth
            wireless link, and an electrode array in the visual cortex that produces a spatial
            pattern of phosphenes.
      - title: Technical Co-founder
        org: Schooling Studio
        period: Apr 2021 – Mar 2023
        about: >-
          An AI maths tutor for school students: photograph a question and get the solution,
          explained step by step.
        plain:
          - Built on the same kind of AI as ChatGPT, before ChatGPT launched.
          - "{ss_paid_users} paying users in {ss_paid_weeks}, with no paid advertising."
          - >-
            Raised {ss_credits} in cloud and software credits from AWS, Segment, Mixpanel and
            Intercom to fund the build.
          - Finance sat alongside product — budgets, forecasts, accounts and tax.
        technical:
          - An LLM-based tutor for maths and science, built before ChatGPT launched.
          - "{ss_paid_users} paying users in {ss_paid_weeks}, acquired without paid marketing."
          - >-
            Owned the product lifecycle — discovery, product requirements, UX direction, roadmap
            and OKRs, go-to-market — and the finance function; raised {ss_credits} in cloud and
            software credits (AWS, Segment, Mixpanel, Intercom) to fund the build.
      - title: Founder
        org: InGrain
        period: Sep – Dec 2021
        about: An app for investing in property from a few dollars.
        plain:
          - "{ingrain_waitlist} people joined the waiting list in under three months, before launch."
          - >-
            Pakistan's securities regulator did not grant the licence it needed, so the focus
            moved to education, where Schooling Studio found its market.
        technical:
          - >-
            A marketplace for units of closed-ended real-estate funds: pooled bookings held in
            third-party escrow, released on full subscription, and resaleable in the app.
          - "{ingrain_waitlist} waiting-list sign-ups in under three months, with no paid acquisition."
          - Stopped for want of a licence from the Securities and Exchange Commission of Pakistan (SECP).

  - id: gat
    org: GAT Consulting
    about: A management consultancy working for government bodies and manufacturers.
    period: Jan 2018 – Mar 2021
    basis: >-
      His own account; the four TUSDEC reports and their TORs; the cutlery interim report
      (TUSDEC, 17 May 2019) and options paper (PIDC, Oct 2020); the manufacturer's process
      documents (11 Jan 2019); his account of his role, 2026-09-27.
    positions:
      - title: Business Transformation Consultant
        period: Jan 2018 – Mar 2021
        plain:
          - >-
            Built the reports end to end — field research, analysis and financial models — for
            {gat_studies} national feasibility studies commissioned by TUSDEC, the government's
            technology-upgrade company. They covered construction materials, technical textiles,
            sportswear and light engineering.
          - >-
            Researched a national study of Pakistan's cutlery industry: a survey of
            {gat_cutlery_firms}, {gat_cutlery_fgd} and factory visits in China and Vietnam.
          - >-
            For PIDC, the government's industrial development corporation, designed a new way to
            run a shared factory for the cutlery industry. A university would own and operate it,
            and put its income back into research and scholarships.
          - >-
            At a cosmetics manufacturer, lean methods and production plans built on
            {gat_data_years} of sales data brought the cost of goods sold down {gat_cogs} in the
            first year.
          - >-
            Also designed the layout of its {gat_warehouse} warehouse and launched its online
            store, which converted {gat_ecom_conversion} of visitors and brought back
            {gat_ecom_returning} of customers.
          - >-
            Led an ERP rollout end to end, and built a digital records system for an engineering
            firm that halved the time to prepare a project's final claim.
        technical:
          - >-
            The reports and financial models for {gat_studies} TUSDEC feasibility studies under the National
            Strategic Programme for Acquisition of Industrial Technology — testing facilities for
            construction materials and technical textiles, waterless dyeing for sportswear, and
            digital design for light engineering: three-statement projections with scenario and
            risk analysis, feeding cost–benefit analysis and Planning Commission proposals.
          - >-
            Field research and analysis for the cutlery-sector benchmarking study: a systematic
            random sample of {gat_cutlery_firms} from {gat_cutlery_population} registered firms, a
            questionnaire field-tested and cut from {gat_cutlery_items}, analysis in SPSS, and
            findings validated in {gat_cutlery_fgd}.
          - >-
            Designed the Own-Operate-Develop-Educate partnership model for PIDC's proposed
            cutlery common production facility: an adaptation of the World Bank's
            Own-Develop-Operate PPP in which a partner university owns and operates the facility,
            and its revenue is ring-fenced for expansion, R&D and an endowment.
