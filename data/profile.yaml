# Single source of truth. Every published surface is generated from this file.
#
# Provenance rules (enforced by src/schema/claim.ts, checked by scripts/check-profile.ts):
#   - `figure` uses strictClaim: there is NO `assumed` state. A number that has not been
#     traced to a source cannot be written here at all — the build fails at parse time.
#   - `basis` records where the figure came from, so a reader or an interviewer can check it.
#   - `caveat` is a limit that travels with the value and must be rendered wherever the
#     value is. Use it when a true number would mislead on its own.
#
# Content is deliberately minimal until positioning fixes the case studies. The point of
# landing it now is that the rules are load-bearing from the first commit.

