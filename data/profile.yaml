# Single source of truth. Every published surface is generated from this file.
#
# Provenance rules (enforced by src/schema/claim.ts and src/schema/profile.ts):
#   - Every number lives under `figures`, uses strictClaim, and has NO `assumed` state. A figure
#     not traced to a source cannot be written here at all — the build fails at parse time.
#   - Prose never types a number. It embeds a figure by id — `{pg_ai_median}` — so each fact is
#     written once and both registers (plain and technical, ADR 002) quote the same value.
#   - `basis` records where a figure came from. `source` names a public document a reader can
#     open; figures without one come from private records or his own account.
#   - `caveat` is a limit that travels with the value. The renderer shows it wherever the value
#     appears, and `check-dist` fails the build on the built page if it does not.
#
# Disclosure rule (his instruction, 2026-09-27): name employers and public bodies; never a
# private client. `scripts/check-dist.ts` enforces it on the built site.

person:
  name: Nasik Abbas
  role: Applied AI Lead
  location: Pakistan
  relocation: Open to relocation
  email: syed.nasik.abbas@gmail.com
  pronouns: he/him
  links:
    linkedin: https://www.linkedin.com/in/nasik-abbas/
    github: https://github.com/nasikabbas
  headline:
    plain: Building AI products that work in real businesses, not just in the lab.
    technical: Production LLM systems, and the evaluation that shows whether they work.
  summary:
    plain:
      - >-
        Plenty of AI looks impressive in a demo. The harder part is making it hold up with real
        customers, real data and busy staff, and knowing with numbers whether it actually helps.
      - >-
        That is the work at PadelOS, where PadelGPT answers players for padel clubs in
        {pg_countries}. Players get a first answer in a median of {pg_ai_median}, against
        {pg_staff_median} from club staff.
      - >-
        The road here ran through solar engineering, management consulting and three startups,
        which keeps the questions practical: does it work, who does it help, and what does it
        change?
    technical:
      - >-
        Leading PadelGPT at PadelOS: a multi-agent LLM system for players and club staff, shipped
        as {pg_releases} versioned releases in {pg_release_span} and evaluated on {eval_threads}
        real support threads.
      - >-
        The road here ran through product management for an IoT supply-chain platform in Saudi
        Arabia, three startups, and three years of consulting in process engineering, ERP and
        financial modelling.
  contact: >-
    Currently leading applied AI at PadelOS, and always glad to talk about roles where AI has to
    work in a real business.

